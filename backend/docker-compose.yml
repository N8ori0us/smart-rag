services:
  rag-core:
    image: python:3.11-slim
    container_name: smart-rag-container
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    command: tail -f /dev/null
    depends_on:
      - qdrant_db 
    restart: unless-stopped

  qdrant_db:
    image: qdrant/qdrant:latest 
    container_name: smart-qdrant-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped