version: '3.8'

services:
  rag-core:
    image: python:3.11-slim
    container_name: smart-rag-container
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    command: tail -f /dev/null  # Keep the container running for development 
    restart: unless-stopped